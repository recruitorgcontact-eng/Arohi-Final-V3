name: Build Google Play Store Bundle (.AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      version_code:
        description: 'Android Version Code (increment for each Play Store release, e.g. 3, 4, 5)'
        required: true
        default: '3'
      version_name:
        description: 'Android Version Name (semantic version, e.g. 1.0.2)'
        required: true
        default: '1.0.2'

jobs:
  build-playstore-aab:
    name: Build & Sign Android App Bundle (.aab)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
          validate-wrappers: false

      - name: Setup Android SDK Environment (API 36)
        run: |
          mkdir -p android
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0" "platforms;android-35" || true

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: |
          if [ ! -d "android/app" ]; then
            npx cap add android
          else
            npx cap sync android
          fi

      - name: Generate Clean Android Launcher & Splash Assets
        run: node scripts/generate-android-icons.cjs

      - name: Prepare Release Signing Keystore
        id: prepare-keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS_SECRET: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS_SECRET: ${{ secrets.KEY_ALIAS }}
          KEY_PASS_SECRET: ${{ secrets.KEY_PASSWORD }}
        run: |
          KEYSTORE_PATH="android/app/keystore/arohi-release.jks"
          STORE_PASS="${KEYSTORE_PASS_SECRET:-arohiai2026}"
          KEY_ALIAS="${KEY_ALIAS_SECRET:-arohi-upload-key}"
          KEY_PASS="${KEY_PASS_SECRET:-arohiai2026}"
          
          node scripts/prepare-keystore.cjs

          # Export RFC PEM certificate for Google Play Console upload key reset
          keytool -export -rfc \
            -keystore "$KEYSTORE_PATH" \
            -alias "$KEY_ALIAS" \
            -file "upload_certificate.pem" \
            -storepass "$STORE_PASS"

          # Output keystore fingerprint info for Google Play Console / Firebase
          echo "=== Keystore SHA-256 Fingerprint ==="
          keytool -list -v -keystore "$KEYSTORE_PATH" -alias "$KEY_ALIAS" -storepass "$STORE_PASS" | grep -E "SHA1|SHA256" || true

          # Create credentials documentation for the user
          mkdir -p keystore-backup
          cp "$KEYSTORE_PATH" keystore-backup/arohi-release.jks
          cp upload_certificate.pem keystore-backup/upload_certificate.pem
          echo "===================================================================" > keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "AROHI AI - GOOGLE PLAY STORE UPLOAD KEYSTORE CREDENTIALS" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "===================================================================" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "File: arohi-release.jks" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "Keystore Password: arohiai2026" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "Key Alias: arohi-upload-key" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "Key Password: arohiai2026" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "Validity: 10,000 days (~27 years)" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "IMPORTANT:" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "Keep this arohi-release.jks file safe! Google Play Console requires" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "all future updates (.aab) of Arohi AI to be signed with this exact key." >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt
          echo "===================================================================" >> keystore-backup/KEYSTORE_CREDENTIALS_README.txt

          # Set environment variables for Gradle
          echo "KEYSTORE_FILE=keystore/arohi-release.jks" >> $GITHUB_ENV
          echo "KEYSTORE_PASSWORD=$STORE_PASS" >> $GITHUB_ENV
          echo "KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
          echo "KEY_PASSWORD=$KEY_PASS" >> $GITHUB_ENV

          # Versioning variables
          V_CODE="${{ github.event.inputs.version_code || '3' }}"
          V_NAME="${{ github.event.inputs.version_name || '1.0.2' }}"
          echo "VERSION_CODE=$V_CODE" >> $GITHUB_ENV
          echo "VERSION_NAME=$V_NAME" >> $GITHUB_ENV

      - name: Make Gradle Wrapper Executable
        run: |
          cd android
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi
          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ] || ! java -jar gradle/wrapper/gradle-wrapper.jar --version > /dev/null 2>&1; then
            gradle wrapper --gradle-version 8.12
            chmod +x gradlew
          fi

      - name: Build Android App Bundle (.aab) & Release APK
        run: |
          cd android
          # Retry loop with fallback to system Gradle in case of network or wrapper hiccups
          for attempt in 1 2 3; do
            echo "==> Build attempt $attempt of 3..."
            if ./gradlew bundleRelease assembleRelease --stacktrace; then
              echo "==> Gradle wrapper build completed successfully!"
              break
            elif gradle bundleRelease assembleRelease --stacktrace; then
              echo "==> Direct Gradle build completed successfully!"
              break
            else
              if [ $attempt -lt 3 ]; then
                echo "==> Attempt $attempt failed. Retrying in 10 seconds..."
                sleep 10
              else
                echo "==> Android build failed after 3 attempts."
                exit 1
              fi
            fi
          done

      - name: Verify and Sign AAB if needed
        run: |
          AAB_FILE=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "Signing $AAB_FILE with jarsigner..."
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore android/app/keystore/arohi-release.jks \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              "$AAB_FILE" "$KEY_ALIAS" || true
            
            echo "Verifying signature..."
            jarsigner -verify -verbose -certs "$AAB_FILE" | grep "jar verified" || true
          fi

      - name: Upload Google Play Store Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: ArohiAI-Google-Play-Bundle-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 90

      - name: Upload Universal Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: ArohiAI-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Google Play Upload Certificate (.pem)
        uses: actions/upload-artifact@v4
        with:
          name: Google-Play-Upload-Certificate-PEM
          path: upload_certificate.pem
          if-no-files-found: warn
          retention-days: 90

      - name: Upload Keystore & Credentials Backup
        uses: actions/upload-artifact@v4
        with:
          name: ArohiAI-Signing-Credentials-Backup
          path: keystore-backup/
          if-no-files-found: warn
          retention-days: 90
